<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Abstract world trade network</title>
  <desc id="desc">A simple academic-style network map showing connected trade nodes across regions.</desc>
  <defs>
    <linearGradient id="tradeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="320" rx="18" fill="none"/>

  <g opacity="0.5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5">
    <path d="M92 142 C126 105 182 90 225 112 C259 129 286 126 319 109 C357 90 409 104 430 137 C393 150 363 171 319 166 C270 159 235 184 193 172 C150 160 127 161 92 142 Z"/>
    <path d="M456 119 C492 87 552 82 590 109 C619 129 650 126 683 111 C727 91 781 112 808 151 C760 159 729 185 682 174 C637 164 611 184 567 169 C526 156 494 148 456 119 Z"/>
    <path d="M486 215 C527 194 574 198 607 221 C582 244 539 254 494 240 C467 232 464 224 486 215 Z"/>
  </g>

  <g fill="none" stroke="url(#tradeLine)" stroke-width="3" stroke-linecap="round" opacity="0.78">
    <path d="M180 152 C270 82 390 76 500 132"/>
    <path d="M500 132 C594 92 698 99 762 152"/>
    <path d="M180 152 C294 236 472 250 612 224"/>
    <path d="M330 142 C440 204 558 205 700 164"/>
    <path d="M500 132 C520 166 552 195 612 224"/>
  </g>

  <g filter="url(#softShadow)">
    <g fill="#ffffff" stroke="#2563eb" stroke-width="4">
      <circle cx="180" cy="152" r="13"/>
      <circle cx="330" cy="142" r="11"/>
      <circle cx="500" cy="132" r="14"/>
      <circle cx="700" cy="164" r="12"/>
      <circle cx="762" cy="152" r="11"/>
      <circle cx="612" cy="224" r="13"/>
    </g>
    <g fill="#0f766e">
      <circle cx="180" cy="152" r="4"/>
      <circle cx="330" cy="142" r="4"/>
      <circle cx="500" cy="132" r="5"/>
      <circle cx="700" cy="164" r="4"/>
      <circle cx="762" cy="152" r="4"/>
      <circle cx="612" cy="224" r="5"/>
    </g>
  </g>

  <g fill="#475569" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <text x="180" y="184" text-anchor="middle">Exporters</text>
    <text x="500" y="104" text-anchor="middle">Gravity links</text>
    <text x="704" y="197" text-anchor="middle">Importers</text>
    <text x="612" y="258" text-anchor="middle">Policy variation</text>
  </g>
</svg>
